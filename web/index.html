<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'none'">
<title>Kimi 2007</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desktop">

  <!-- ============ 主窗口 ============ -->
  <div class="window" id="window">

    <!-- 标题栏 -->
    <div class="titlebar" id="titlebar">
      <svg class="title-icon" viewBox="0 0 24 24">
        <path d="M17.5 13.5a7.5 7.5 0 1 1-9-11.8 6 6 0 1 0 9 11.8z" fill="#ffd95e" stroke="#c98f1b" stroke-width="1"/>
        <circle cx="17" cy="6" r="1.3" fill="#fff"/>
        <circle cx="20" cy="9" r="0.9" fill="#fff"/>
      </svg>
      <span class="title-text" id="titleText">Kimi 2007 - 优化 KV 读写成本</span>
      <div class="title-btns">
        <button class="tbtn min" id="btnMin" type="button" title="最小化" aria-label="最小化窗口"></button>
        <button class="tbtn max" id="btnMax" type="button" title="最大化" aria-label="最大化窗口"></button>
        <button class="tbtn close" id="btnClose" type="button" title="关闭" aria-label="关闭窗口">×</button>
      </div>
    </div>

    <!-- 主体三栏 -->
    <div class="main">

      <!-- 左栏 -->
      <aside class="side-left">
        <div class="sl-head">
          <span class="sl-logo">🌙</span>
          <span class="sl-title">Kimi</span>
          <button class="sl-menu-btn" id="slMenuBtn" type="button" title="打开 Kimi 菜单" aria-label="打开 Kimi 菜单" aria-expanded="false">⌄</button>
        </div>
        <div class="sl-menu" id="slMenu" role="menu">
          <button class="model-opt" id="slLayout" type="button" role="menuitem">🖥️ 界面布局</button>
          <button class="model-opt" id="slShortcuts" type="button" role="menuitem">⌨ 快捷键</button>
          <button class="model-opt" id="slAbout" type="button" role="menuitem">ℹ️ 关于</button>
        </div>

        <nav class="sl-nav">
          <button class="sl-item" id="slSchedule" type="button"><span class="sl-ico" aria-hidden="true">🗓️</span>临时提醒</button>
          <button class="sl-item" id="slPlugins" type="button"><span class="sl-ico" aria-hidden="true">🧩</span>模型与工具</button>
          <button class="sl-item" id="slSites" type="button"><span class="sl-ico" aria-hidden="true">🌐</span>工作区</button>
          <button class="sl-item" id="slGit" type="button"><span class="sl-ico" aria-hidden="true">🔀</span>Git 检查</button>
        </nav>

        <div class="sl-group">
          <span>会话</span>
          <button class="sl-new" id="navNew" type="button" title="新建会话">＋ 新建</button>
        </div>
        <!-- 筛选控件在列表之上：输入时结果向下变化，滚动列表时筛选状态始终可见 -->
        <div class="sl-search">
          <input type="search" id="sessSearch" placeholder="搜索会话..." aria-label="搜索会话">
          <span class="sl-search-ico">🔍</span>
        </div>
        <div class="sl-tools">
          <select id="sessGroupSel" class="sl-group-sel" aria-label="会话分组方式">
            <option value="time">按时间</option>
            <option value="tag">按标签</option>
            <option value="date">按日期</option>
            <option value="workspace">按工作区</option>
          </select>
          <button class="sl-fav" id="favBtn" type="button" title="打开收藏知识库" aria-label="打开收藏知识库">
            <span class="sl-fav-star" aria-hidden="true">★</span><span>收藏</span><span class="sl-fav-count" id="favCount" hidden>0</span>
          </button>
        </div>
        <div class="sess-list" id="sessList" role="list"></div>
      </aside>

      <!-- 中栏:聊天 -->
      <main class="chat">
        <div class="chat-head">
          <button class="chat-mobile-btn" id="sessionsToggle" type="button" title="显示会话列表" aria-label="显示会话列表" aria-controls="sessList" aria-expanded="false">☰</button>
          <span class="ch-ico">📄</span>
          <span class="ch-title" id="chatTitle">优化 KV 读写成本</span>
          <span class="ch-ws" id="chatWs" hidden></span>
          <button class="chat-head-btn" id="chatTagBtn" type="button" title="编辑当前会话标签" aria-label="编辑当前会话标签">🏷</button>
          <button class="chat-head-btn" id="exportMdBtn" type="button" title="导出会话为 Markdown" aria-label="导出会话为 Markdown">📤</button>
          <button class="chat-mobile-btn" id="activityToggle" type="button" title="显示活动中心" aria-label="显示活动中心" aria-controls="activityPanel" aria-expanded="false">☷</button>
        </div>

        <div class="chat-stream">
          <div class="chat-body" id="chatBody" tabindex="0" role="log" aria-live="off" aria-relevant="additions" aria-label="会话消息"></div>
          <button class="jump-latest" id="jumpLatest" type="button" hidden>↓ 查看新消息</button>
        </div>

        <!-- 输入区 -->
        <div class="composer">
          <div class="attach-row" id="attachRow" hidden></div>
          <input type="file" id="fileImage" accept="image/*" multiple hidden>
          <input type="file" id="fileAny" multiple hidden>
          <div class="cp-tools">
            <button class="cp-item" id="emojiBtn" type="button" aria-haspopup="true" aria-expanded="false">😊 表情</button>
            <button class="cp-item" id="imgBtn" type="button">🖼️ 图片</button>
            <button class="cp-item" id="attachBtn" type="button">📎 文件</button>
            <button class="cp-font" id="fontBtn" type="button" title="聊天字号">A</button>
          </div>
          <textarea id="input" placeholder="输入消息" aria-label="给 Kimi 的消息"></textarea>
          <div class="cp-bottom">
            <span class="cp-hint" id="sendHint"></span>
            <div class="cp-right">
              <button class="model-btn" id="modelBtn" type="button" aria-haspopup="menu" aria-expanded="false">⚡ <span id="modelName">k3</span> ▾</button>
              <div class="send-wrap">
                <button class="send-btn" id="sendBtn" type="button">发送</button>
                <button class="send-btn stop" id="stopBtn" type="button" style="display:none" title="停止当前回答">停止</button>
                <button class="send-more" id="sendMore" type="button" title="发送方式" aria-label="选择发送方式" aria-haspopup="menu" aria-expanded="false">▾</button>
              </div>
            </div>
          </div>

          <!-- 发送方式菜单 -->
          <div class="model-menu send-mode-menu" id="sendModeMenu" role="menu" aria-label="发送方式">
            <button class="model-opt" type="button" role="menuitemradio" data-mode="enter">⏎ Enter 发送</button>
            <button class="model-opt" type="button" role="menuitemradio" data-mode="ctrl">^ Ctrl+Enter 发送</button>
          </div>

          <!-- 表情弹窗 -->
          <div class="emoji-pop" id="emojiPop"></div>
          <!-- 模型菜单：运行时从本机 Kimi 服务读取 -->
          <div class="model-menu" id="modelMenu" role="menu" aria-label="当前会话模型"></div>
          <!-- / 命令与 @ 文件补全菜单 -->
          <div class="complete-pop" id="completePop" role="listbox" aria-label="补全建议"></div>
        </div>
      </main>

      <!-- 右栏 -->
      <aside class="side-right" id="activityPanel" tabindex="-1" aria-label="会话活动中心">
        <div class="sr-head">
          <span class="sr-ico" aria-hidden="true">▣</span>
          <span class="sr-title">活动中心</span>
          <span class="sr-btns">
            <button id="srHide" type="button" title="隐藏活动中心" aria-label="隐藏活动中心">✕</button>
          </span>
        </div>

        <div class="activity-summary" id="activitySummary">
          <span class="activity-state" id="activityState">正在同步活动…</span>
          <button class="activity-action" id="activityRetry" type="button" hidden>重试</button>
        </div>
        <div class="activity-scroll">
          <section class="activity-section" id="activityPendingSection">
            <div class="activity-section-head">待你处理 <span class="activity-count" id="activityPendingCount">0</span></div>
            <div class="activity-list" id="activityPending"></div>
          </section>
          <section class="activity-section">
            <div class="activity-section-head">任务</div>
            <div class="activity-list" id="activityTasks"></div>
          </section>
          <section class="activity-section">
            <div class="activity-section-head">实时工具</div>
            <div class="activity-list" id="activityLiveTools"></div>
          </section>
          <section class="activity-section">
            <div class="activity-section-head">子代理</div>
            <div class="activity-list" id="activityChildren"></div>
          </section>
          <section class="activity-section">
            <div class="activity-section-head">终端</div>
            <div class="activity-list" id="activityTerminals"></div>
          </section>
          <div class="activity-empty" id="activityEmpty" hidden>这个会话还没有正在进行或可追溯的活动。</div>
        </div>

      </aside>
    </div>

    <!-- 状态栏 -->
    <footer class="statusbar">
      <div class="st-left">
        <button class="st-action" id="stCopyCwd" type="button" title="复制工作目录">📁 复制目录</button>
      </div>
      <div class="st-right">
        <button class="st-item st-action" id="connStatus" type="button" aria-live="polite">🔴 未连接</button>
        <button class="st-item st-action ctx-hp" id="ctxInfo" type="button" title="上下文用量">
          <span class="ctx-hp-bar" id="ctxBar"></span>
          <span class="ctx-hp-text" id="ctxBarText">📊 -</span>
        </button>
        <button class="st-item st-action st-permission" id="permissionInfo" type="button" title="选择当前会话权限模式" aria-haspopup="dialog" aria-expanded="false">🛡️ - ▾</button>
        <button class="st-item st-action" id="bellToggle" type="button" title="消息提示音">🔔</button>
        <span class="st-item st-clock" id="clock">22:48</span>
      </div>
    </footer>

    <!-- 活动中心收回后的展开条：必须在 .window 内，否则贴视口右缘会飘到窗口外 -->
    <button class="sr-reopen" id="srReopen" type="button" hidden title="展开活动中心" aria-label="展开活动中心">«</button>

    <!-- 代码宠物：互动按钮常驻在宠物左侧，full 布局下右栏底部预留（见 style.css .pet-area） -->
    <div class="pet-area" id="petArea">
      <div class="pet-actions" id="petActions" role="group" aria-label="宠物互动">
        <button class="pet-action" id="petActionFeed" type="button" aria-label="喂食" title="喂食">
          <span class="pet-action-icon" aria-hidden="true">🐟</span><span class="pet-action-label">喂食</span><b id="petActionFeedValue">100</b>
        </button>
        <button class="pet-action" id="petActionBath" type="button" aria-label="洗澡" title="洗澡">
          <span class="pet-action-icon" aria-hidden="true">🛁</span><span class="pet-action-label">洗澡</span><b id="petActionBathValue">100</b>
        </button>
        <button class="pet-action" id="petActionPlay" type="button" aria-label="玩耍" title="玩耍">
          <span class="pet-action-icon" aria-hidden="true">🧶</span><span class="pet-action-label">玩耍</span><b id="petActionPlayValue">100</b>
        </button>
        <button class="pet-action" id="petActionInfo" type="button" aria-label="宠物资料" aria-controls="petStats" aria-expanded="false" title="宠物资料">
          <span class="pet-action-icon" aria-hidden="true">📋</span><span class="pet-action-label">资料</span>
        </button>
      </div>
      <div class="pet-card" id="petCard">
        <div class="pet-bubble" id="petBubble"></div>
        <canvas class="pet-canvas" id="petCanvas" width="56" height="68" aria-label="小企鹅代码宠物" role="img"></canvas>
        <!-- 悬浮数值卡：悬停宠物显示三条数值；「宠物资料」按钮可固定展开明细。 -->
        <div class="pet-stats" id="petStats">
          <div class="pet-stats-row pet-stats-lv"><span id="petStatsLv">Lv.1</span><div class="pet-bar exp"><i id="petStatsExpBar"></i></div></div>
          <div class="pet-stats-row"><span>饥饿</span><div class="pet-bar hunger"><i id="petBarHunger"></i></div><b id="petNumHunger"></b></div>
          <div class="pet-stats-row"><span>清洁</span><div class="pet-bar clean"><i id="petBarClean"></i></div><b id="petNumClean"></b></div>
          <div class="pet-stats-row"><span>心情</span><div class="pet-bar mood"><i id="petBarMood"></i></div><b id="petNumMood"></b></div>
          <div class="pet-stats-detail" id="petStatsDetail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 通用面板(模型/工作区/Git/提醒) -->
  <div class="panel-backdrop" id="panelBackdrop" hidden></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden>
    <div class="panel-head">
      <span class="panel-title" id="panelTitle">面板</span>
      <button class="panel-close" id="panelClose" type="button" aria-label="关闭面板">✕</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>

  <!-- 命令面板(⌘/Ctrl + K) -->
  <div class="cmdk-backdrop" id="cmdkBackdrop" hidden></div>
  <div class="cmdk" id="cmdk" role="dialog" aria-modal="true" aria-label="命令面板" hidden>
    <div class="cmdk-search">
      <span class="cmdk-search-ico" aria-hidden="true">⌘</span>
      <input type="text" id="cmdkInput" class="cmdk-input" role="combobox" aria-expanded="true"
        aria-controls="cmdkList" aria-autocomplete="list" autocomplete="off" spellcheck="false"
        placeholder="搜索命令、会话、模型…" aria-label="搜索命令、会话、模型">
    </div>
    <div class="cmdk-list" id="cmdkList" role="listbox" aria-label="命令结果"></div>
    <div class="cmdk-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>↵</kbd> 执行</span>
      <span><kbd>Esc</kbd> 关闭</span>
    </div>
  </div>

  <div class="mobile-backdrop" id="mobileBackdrop" hidden></div>
  <div class="toast-region" id="toastRegion" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="replyAnnouncer" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- 退出遮罩 -->
  <div class="bye" id="bye">
    <div class="bye-box">
      <div class="bye-title">Kimi 2007</div>
      <div class="bye-text">「下次再聊～」</div>
      <div class="bye-tip">点击任意处重新登录</div>
    </div>
  </div>
</div>

<script src="vendor/markdown-it.min.js"></script>
<script src="runtime/bootstrap.js"></script>
</body>
</html>
